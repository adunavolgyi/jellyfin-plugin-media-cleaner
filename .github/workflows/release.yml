name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      jellyfin-matrix: ${{ steps.jellyfin-matrix.outputs.matrix }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Prepare Jellyfin Matrix
        id: jellyfin-matrix
        shell: pwsh
        run: |-
          $matrix = ./eng/get-jellyfin-profiles.ps1 -Format GitHubMatrix
          "matrix=$matrix" >> $env:GITHUB_OUTPUT
      -
        name: Verify Generated Jellyfin Profiles
        shell: pwsh
        run: |-
          ./eng/generate-jellyfin-props.ps1
          git diff --exit-code Directory.JellyfinProfiles.props

  test:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |-
            8.0.x
            9.0.x
            10.0.x
      -
        name: Run Unit Tests
        run: dotnet test MediaCleaner.Tests/MediaCleaner.Tests.csproj -c Release

  build:
    runs-on: ubuntu-latest
    needs: [prepare, test]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.jellyfin-matrix) }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      -
        name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |-
            8.0.x
            9.0.x
            10.0.x
      -
        name: Prepare Jellyfin Metadata (${{ matrix.jellyfin-profile }})
        shell: pwsh
        run: ./eng/write-build-yaml.ps1 -Profile ${{ matrix.jellyfin-profile }} -OutputPath build.yaml
      -
        name: Build Jellyfin Plugin (${{ matrix.jellyfin-profile }})
        uses: oddstr13/jellyfin-plugin-repository-manager@v1.1.1
        id: jprm
        env:
          JellyfinProfile: ${{ matrix.jellyfin-profile }}
        with:
          output: ./artifacts/${{ matrix.jellyfin-profile }}
          dotnet-config: Release
          dotnet-target: ${{ matrix.dotnet-target }}
      -
        name: Normalize Release Asset Name (${{ matrix.jellyfin-profile }})
        run: cp "${{ steps.jprm.outputs.artifact }}" "artifacts/${{ matrix.jellyfin-profile }}/MediaCleaner-${{ matrix.jellyfin-profile }}.zip"
      -
        name: Write Manifest Entry (${{ matrix.jellyfin-profile }})
        shell: pwsh
        run: |-
          $yaml = Get-Content -Raw build.yaml
          function Read-Field($name) { [regex]::Match($yaml, "(?m)^${name}: `"(.*)`"").Groups[1].Value }
          [pscustomobject]@{
            profile = '${{ matrix.jellyfin-profile }}'
            version = Read-Field 'version'
            targetAbi = Read-Field 'targetAbi'
            guid = Read-Field 'guid'
            name = Read-Field 'name'
            overview = Read-Field 'overview'
            owner = Read-Field 'owner'
            category = Read-Field 'category'
          } | ConvertTo-Json | Set-Content "artifacts/${{ matrix.jellyfin-profile }}/manifest-entry-${{ matrix.jellyfin-profile }}.json"
      -
        name: Upload Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-${{ matrix.jellyfin-profile }}
          retention-days: 1
          if-no-files-found: error
          path: |
            artifacts/${{ matrix.jellyfin-profile }}/MediaCleaner-${{ matrix.jellyfin-profile }}.zip
            artifacts/${{ matrix.jellyfin-profile }}/manifest-entry-${{ matrix.jellyfin-profile }}.json

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      -
        name: Download Release Assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-asset-*
          merge-multiple: true
          path: release-assets
      -
        name: Prepare Release Checksums
        run: |-
          for artifact in release-assets/*.zip; do
            hash="$(md5sum "$artifact" | cut -d ' ' -f 1)"
            echo "$hash $(basename "$artifact")" >> checksums.txt
          done
      -
        name: Changelog
        uses: Bullrich/generate-release-changelog@master
        id: changelog
        env:
          REPO: ${{ github.repository }}
      -
        name: Release
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            checksums.txt
            release-assets/*.zip
      -
        name: Publish Jellyfin Repository Manifest
        shell: pwsh
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          GH_TOKEN: ${{ github.token }}
        run: |-
          $remote = "https://x-access-token:$($env:GH_TOKEN)@github.com/${{ github.repository }}.git"
          git clone --branch gh-pages --single-branch $remote pages
          if ($LASTEXITCODE -ne 0) {
            git init -b gh-pages pages
            git -C pages remote add origin $remote
          }
          ./eng/write-manifest.ps1 -AssetsPath release-assets -Tag '${{ github.ref_name }}' -Repository '${{ github.repository }}' -ManifestPath pages/manifest.json -Changelog $env:CHANGELOG
          git -C pages config user.name "github-actions[bot]"
          git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C pages add manifest.json
          git -C pages commit -m "Publish manifest for ${{ github.ref_name }}"
          git -C pages push origin gh-pages
